<!doctype html>
<html lang="sk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GTA Gregorovce</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #dfc193;
        font-family: "Barlow Condensed", system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #fff;
      }
      canvas {
        display: block;
      }
      #crosshair {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 8px;
        height: 8px;
        margin: -4px 0 0 -4px;
        border: 2px solid rgba(255, 255, 255, 0.85);
        border-radius: 50%;
        pointer-events: none;
        box-shadow: 0 0 4px rgba(0, 0, 0, 0.6);
      }
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      #hud.hidden,
      #overlay.hidden {
        display: none;
      }
      #gta-hud {
        position: absolute;
        right: 16px;
        top: 16px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 5px;
        pointer-events: none;
        text-shadow:
          1px 1px 0 #000,
          -1px 1px 0 #000,
          1px -1px 0 #000,
          -1px -1px 0 #000,
          2px 2px 2px rgba(0, 0, 0, 0.55);
      }
      #stars {
        font-size: 21px;
        letter-spacing: 3px;
        color: #9a9a9a;
      }
      #status-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      #weapon-slot {
        width: 46px;
        height: 46px;
        display: grid;
        place-items: center;
        background: rgba(10, 8, 6, 0.45);
        border: 2px solid rgba(0, 0, 0, 0.8);
        outline: 1px solid rgba(255, 214, 140, 0.3);
        border-radius: 8px;
      }
      #clock {
        font-family: "Anton", "Barlow Condensed", sans-serif;
        font-size: 27px;
        color: #fff;
      }
      #stamina {
        width: 156px;
        height: 14px;
        background: rgba(10, 8, 6, 0.55);
        border: 2px solid #000;
        border-radius: 2px;
        overflow: hidden;
      }
      #stamina-fill {
        width: 100%;
        height: 100%;
        background: #b4191d;
      }
      #money {
        font-family: "Anton", "Barlow Condensed", sans-serif;
        font-size: 27px;
        color: #43a13c;
      }
      #radar-wrap {
        position: absolute;
        left: 16px;
        bottom: 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      #info {
        font-size: 14px;
        opacity: 0.9;
        text-shadow: 1px 1px 0 #000;
      }
      #minimap {
        display: block;
        width: 200px;
        height: 200px;
        /* GTA radar: circular, thick black frame */
        border-radius: 50%;
        border: 3px solid #000;
        outline: 2px solid rgba(255, 214, 140, 0.35);
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
      }
      #keys {
        position: absolute;
        right: 16px;
        bottom: 16px;
        background: rgba(10, 8, 6, 0.45);
        border: 1px solid rgba(0, 0, 0, 0.55);
        outline: 1px solid rgba(255, 214, 140, 0.25);
        border-radius: 4px;
        padding: 10px 14px;
        font-size: 15px;
        line-height: 1.7;
        text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.85);
      }
      kbd {
        display: inline-block;
        min-width: 20px;
        text-align: center;
        padding: 1px 6px;
        margin-right: 6px;
        border-radius: 5px;
        background: rgba(255, 255, 255, 0.14);
        border: 1px solid rgba(255, 255, 255, 0.22);
        font-family: inherit;
        font-size: 12px;
      }
      #overlay {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #dfc193 url("assets/loading.jpg") center / cover no-repeat;
        z-index: 10;
      }
      #overlay::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          rgba(0, 0, 0, 0.32),
          transparent 26%,
          transparent 62%,
          rgba(0, 0, 0, 0.38)
        );
        pointer-events: none;
      }
      #menu-title {
        position: absolute;
        top: 5%;
        left: 0;
        right: 0;
        text-align: center;
        font-family: "Anton", "Barlow Condensed", sans-serif;
        font-size: clamp(44px, 7vw, 76px);
        font-weight: 400;
        letter-spacing: 0.04em;
        color: #f0a13c;
        text-shadow:
          4px 4px 0 #000,
          -2px -2px 0 rgba(0, 0, 0, 0.6);
        pointer-events: none;
      }
      #start {
        pointer-events: auto;
        cursor: pointer;
        position: absolute;
        left: 50%;
        bottom: 17%;
        transform: translateX(-50%);
        font-family: "Anton", "Barlow Condensed", sans-serif;
        font-size: 24px;
        letter-spacing: 0.14em;
        color: #1c1106;
        background: #f0a13c;
        border: 3px solid #000;
        border-radius: 6px;
        padding: 14px 66px;
        box-shadow: 0 4px 0 #000, 0 8px 18px rgba(0, 0, 0, 0.4);
        transition: transform 0.12s ease, background 0.12s ease, opacity 0.3s ease;
      }
      #start:hover:not(:disabled) {
        transform: translateX(-50%) translateY(-2px);
        background: #ffb95a;
      }
      #start:disabled {
        cursor: wait;
        opacity: 0.45;
        box-shadow: 0 4px 0 #000;
      }
      #loading-row {
        position: absolute;
        left: 40px;
        bottom: 32px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        transition: opacity 0.6s ease;
      }
      #overlay.ready #loading-row {
        opacity: 0;
        visibility: hidden;
      }
      #loading-label {
        font-family: "Anton", "Barlow Condensed", sans-serif;
        font-size: 24px;
        letter-spacing: 0.18em;
        color: #f5f0e0;
        text-shadow: 3px 3px 0 #000;
      }
      #loading-bar {
        width: min(460px, 60vw);
        height: 20px;
        background: #35302a;
        border: 3px solid #191512;
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.35);
      }
      #loading-fill {
        width: 0%;
        height: 100%;
        background: #f2ead0;
        animation: loading-sweep 5s ease-out forwards;
      }
      #overlay.ready #loading-fill {
        width: 100%;
        animation: none;
        transition: width 0.3s ease;
      }
      @keyframes loading-sweep {
        from { width: 0%; }
        to { width: 88%; }
      }
      #credit {
        position: absolute;
        right: 12px;
        bottom: 8px;
        font-size: 11px;
        color: rgba(255, 246, 228, 0.6);
        text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.7);
      }
      /* Touch controls — phones/tablets only (body.touch). */
      #touch-layer {
        position: fixed;
        inset: 0;
        z-index: 5;
        display: none;
        touch-action: none;
      }
      body.touch #touch-layer {
        display: block;
      }
      body.touch #keys {
        display: none;
      }
      #joystick-base {
        position: fixed;
        width: 118px;
        height: 118px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.45);
        background: rgba(0, 0, 0, 0.22);
        display: none;
        pointer-events: none;
      }
      #joystick-knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.5);
        border: 2px solid rgba(0, 0, 0, 0.4);
        transform: translate(-50%, -50%);
      }
      #touch-buttons {
        position: fixed;
        right: 16px;
        bottom: 24px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .tb {
        width: 78px;
        height: 62px;
        border-radius: 8px;
        border: 2px solid #000;
        outline: 1px solid rgba(255, 214, 140, 0.3);
        background: rgba(10, 8, 6, 0.5);
        color: #fff;
        font-family: inherit;
        font-size: 16px;
        font-weight: 600;
        text-shadow: 1px 1px 0 #000;
      }
      .tb:active {
        background: rgba(240, 161, 60, 0.55);
      }
      #btn-menu {
        position: fixed;
        top: 12px;
        left: 12px;
        width: auto;
        height: auto;
        padding: 8px 14px;
      }
      #btn-down.hidden {
        display: none;
      }
      /* Mobile/portrait: keep the loading-art character in frame, shrink the
         radar and tuck it under the top-right stats. */
      @media (orientation: portrait), (max-width: 720px) {
        #overlay {
          background-position: 78% center;
        }
      }
      @media (max-width: 720px) {
        #menu-title {
          font-size: 44px;
        }
      }
      body.touch #radar-wrap {
        top: 205px;
        right: 12px;
        bottom: auto;
        left: auto;
        align-items: flex-end;
      }
      body.touch #minimap {
        width: 124px;
        height: 124px;
      }
      body.touch #info {
        font-size: 12px;
      }
      #loading {
        position: fixed;
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        font-size: 13px;
        opacity: 0.8;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.180.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.180.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="crosshair"></div>
    <div id="touch-layer">
      <button id="btn-menu" class="tb">MENU</button>
      <div id="joystick-base"><div id="joystick-knob"></div></div>
      <div id="touch-buttons">
        <button id="btn-jump" class="tb">&#8593;</button>
        <button id="btn-down" class="tb">&#8595;</button>
        <button id="btn-fly" class="tb">FLY</button>
        <button id="btn-r" class="tb">R</button>
      </div>
    </div>
    <div id="hud" class="hidden">
      <div id="gta-hud">
        <div id="stars">★★★★★★</div>
        <div id="status-row">
          <div id="weapon-slot" title="Lupa">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#f2ead0" stroke-width="2.4" stroke-linecap="round" aria-label="Lupa">
              <circle cx="10.5" cy="10.5" r="6.5" />
              <line x1="15.5" y1="15.5" x2="21" y2="21" />
            </svg>
          </div>
          <div id="clock">--:--</div>
        </div>
        <div id="stamina" title="Stamina"><div id="stamina-fill"></div></div>
        <div id="money">€00000350</div>
      </div>
      <div id="radar-wrap">
        <div id="info">
          <span id="coords">—</span> · <span id="speed">0 m/s</span> · <span id="mode">Let (F)</span>
        </div>
        <canvas id="minimap" width="200" height="200"></canvas>
      </div>
      <div id="keys">
        <div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> alebo <kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd> pohyb</div>
        <div><kbd>Shift</kbd> beh &nbsp; <kbd>Space</kbd> skok</div>
        <div><kbd>F</kbd> let &nbsp; <kbd>Esc</kbd> uvoľniť myš</div>
      </div>
    </div>
    <div id="overlay">
      <div id="menu-title">GTA GREGOROVCE</div>
      <button id="start" disabled>PLAY</button>
      <div id="loading-row">
        <div id="loading-label">LOADING...</div>
        <div id="loading-bar"><div id="loading-fill"></div></div>
      </div>
      <div id="credit">
        Dáta © OpenStreetMap contributors (ODbL) · Výškopis © Mapzen / AWS
      </div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
